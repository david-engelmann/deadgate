name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: T lib
        continue-on-error: true
        run: cargo test --lib --bins
      - name: T conformance
        continue-on-error: true
        run: cargo test --test conformance
      - name: T flow_hashes
        continue-on-error: true
        run: cargo test --test flow_hashes
      - name: T block_scalars
        continue-on-error: true
        run: cargo test --test block_scalars
      - name: T document_markers
        continue-on-error: true
        run: cargo test --test document_markers
      - name: T spanning_quotes
        continue-on-error: true
        run: cargo test --test spanning_quotes
      - name: T flow_quotes
        continue-on-error: true
        run: cargo test --test flow_quotes
      - name: T anchors_tags
        continue-on-error: true
        run: cargo test --test anchors_tags
      - name: T collection_tags
        continue-on-error: true
        run: cargo test --test collection_tags
      - name: T container_keys
        continue-on-error: true
        run: cargo test --test container_keys
      - name: T explicit_keys
        continue-on-error: true
        run: cargo test --test explicit_keys
      - name: T key_properties
        continue-on-error: true
        run: cargo test --test key_properties
      - name: T cli
        continue-on-error: true
        run: cargo test --test cli
      - name: T contract
        continue-on-error: true
        run: cargo test --test contract
      - name: T setup
        continue-on-error: true
        run: cargo test --test setup
