<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-label="How deadgate works">
  <title>How deadgate works from input ingestion to deterministic verification verdict</title>
  <rect width="960" height="408" rx="20" fill="#faf8f5" stroke="#ded8ce" stroke-width="1.5"/>
  <text x="30" y="42" fill="#d97706" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">ARCHITECTURE PIPELINE  /  DEADGATE</text>
  <text x="30" y="72" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="750">Did the gate actually run?  <tspan fill="#57534e" font-size="15.5" font-weight="450">Offline reconciliation of branch protection, workflow triggers, and job execution history.</tspan></text>
  
  <rect x="28" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="46" y="122" width="42" height="26" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="67" y="139.5" text-anchor="middle" fill="#d97706" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">01</text>
  <text x="46" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">THREE LOCAL EXPORTS</text>
  <line x1="46" y1="190" x2="224" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="46" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="46" dy="0">protection.json,</tspan><tspan x="46" dy="19">.github/workflows, and</tspan><tspan x="46" dy="19">history.json read with</tspan><tspan x="46" dy="19">zero network calls</tspan></text><path d="M245 218 H255 M251 214 L255 218 L251 222" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="258" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="276" y="122" width="42" height="26" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="297" y="139.5" text-anchor="middle" fill="#d97706" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">02</text>
  <text x="276" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">STRICT READERS</text>
  <line x1="276" y1="190" x2="454" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="276" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="276" dy="0">Duplicate-key-refusing</tspan><tspan x="276" dy="19">JSON reader and</tspan><tspan x="276" dy="19">PyYAML-arbitrated YAML 1.1</tspan><tspan x="276" dy="19">parser (bound 4000)</tspan></text><path d="M475 218 H485 M481 214 L485 218 L481 222" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="488" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="506" y="122" width="42" height="26" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="527" y="139.5" text-anchor="middle" fill="#d97706" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">03</text>
  <text x="506" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">PRODUCER MATCHER</text>
  <line x1="506" y1="190" x2="684" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="506" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="506" dy="0">Evaluates push and</tspan><tspan x="506" dy="19">pull_request branch</tspan><tspan x="506" dy="19">filters, path filters, and</tspan><tspan x="506" dy="19">exact matrix expansions</tspan></text><path d="M705 218 H715 M711 214 L715 218 L711 222" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="718" y="104" width="214" height="228" rx="14" fill="#ffffff" stroke="#ded8ce" stroke-width="1.5"/>
  <rect x="736" y="122" width="42" height="26" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="757" y="139.5" text-anchor="middle" fill="#d97706" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">04</text>
  <text x="736" y="176" fill="#1c1917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">PAPER CONVICTION</text>
  <line x1="736" y1="190" x2="914" y2="190" stroke="#ded8ce" stroke-width="1"/>
  <text x="736" y="216" fill="#57534e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="736" dy="0">Classifies every required</tspan><tspan x="736" dy="19">check as alive,</tspan><tspan x="736" dy="19">skipped_only, never_run,</tspan><tspan x="736" dy="19">or no_producer</tspan></text>
  <rect x="28" y="350" width="904" height="38" rx="10" fill="#f1ede6" stroke="#ded8ce" stroke-width="1"/>
  <circle cx="48" cy="369" r="4.5" fill="#22c55e"/>
  <text x="62" y="373.5" fill="#57534e" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5">Zero network calls  |  Deterministic deadgate-report/1 JSON and Markdown  |  Catches renamed checks and skipped-job bypasses</text>
</svg>
