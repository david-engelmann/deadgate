[package]
name = "deadgate"
version = "0.24.0"
edition = "2021"
rust-version = "1.80"
description = "Reconcile required status checks against what CI actually ran"
license = "MIT"
readme = "README.md"
repository = "https://github.com/david-engelmann/deadgate"
homepage = "https://github.com/david-engelmann/deadgate"
documentation = "https://docs.rs/deadgate"
keywords = ["ci", "github-actions", "branch-protection", "audit", "verification"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/**", "tools/**", "CONTRACT.md", "AGENTS.md", ".github/**", "deny.toml", "install.sh"]

[lib]
name = "deadgate"
path = "src/lib.rs"

[[bin]]
name = "deadgate"
path = "src/main.rs"
